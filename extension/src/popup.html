<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 340px;
        margin: 0;
        padding: 12px;
        font: 13px/1.4 system-ui, sans-serif;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      label {
        display: block;
        margin: 8px 0 2px;
        color: #444;
      }
      input,
      textarea,
      select {
        width: 100%;
        box-sizing: border-box;
        padding: 5px;
      }
      textarea {
        height: 56px;
        resize: vertical;
      }
      .row {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }
      button {
        flex: 1;
        padding: 6px;
        cursor: pointer;
      }
      pre {
        background: #f4f4f4;
        padding: 8px;
        max-height: 160px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #status {
        margin-top: 8px;
        color: #666;
        min-height: 16px;
      }
    </style>
  </head>
  <body>
    <h1>Mnemo</h1>
    <label for="baseUrl">Server URL</label>
    <input id="baseUrl" placeholder="http://127.0.0.1:8000" />
    <label for="apiKey">API key</label>
    <input id="apiKey" type="password" placeholder="mnemo-dev-key" />
    <label for="space">Space</label>
    <input id="space" placeholder="default" />
    <div class="row">
      <button id="save">Save</button>
      <button id="test">Test</button>
    </div>
    <label for="writeText">Remember</label>
    <textarea id="writeText" placeholder="Paste context to store..."></textarea>
    <div class="row">
      <button id="write">Write</button>
    </div>
    <label for="query">Recall</label>
    <input id="query" placeholder="what should the model know?" />
    <div class="row">
      <button id="read">Read</button>
    </div>
    <pre id="output"></pre>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
